<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Admin - Prime</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="script.js"></script>
  </head>
  <body data-page="admin-login">
    <main class="login-screen">
      <div class="login-card">
        <p class="eyebrow">Área restrita</p>
        <h1>Painel Administrativo</h1>

        <div class="login-form">
          <label>
            <span>Login</span>
            <input id="admin-login-input" type="text" placeholder="Digite o login" value="b123456" />
          </label>

          <label>
            <span>Senha</span>
            <input id="admin-password-input" type="password" placeholder="Digite a senha" value="654321" />
          </label>

          <button id="admin-login-button" class="btn btn-primary" type="button">Entrar</button>
          <a href="index.html" class="btn btn-secondary full-width">Voltar ao site</a>
        </div>
      </div>
    </main>
  </body>
</html>
